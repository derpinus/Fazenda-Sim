<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazenda Sim - HTML5 Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; color: #8bc34a; text-shadow: 1px 1px 2px #000; }
        #game-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas { background-color: #5d9e39; display: block; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #8bc34a;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
        }
        #controls-hint {
            margin-top: 12px;
            color: #ccc;
            font-size: 13px;
            background: #2a2a2a;
            padding: 8px 16px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>🌾 Fazenda Sim - Protótipo v0.1</h1>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>💰 <b>Moedas:</b> $<span id="coins">0</span></div>
            <div>🥛 <b>Leite no Balde:</b> <span id="milk">0</span>/5</div>
            <div id="action-prompt" style="color: #ffeb3b; margin-top: 5px; font-weight: bold;"></div>
        </div>
    </div>

    <div id="controls-hint">
        🎮 <b>Controles:</b> Use as teclas <b>WASD</b> ou <b>Setas</b> para mover o fazendeiro. Pressione <b>ESPAÇO</b> para interagir.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Estado do Jogo
        const player = { x: 400, y: 300, speed: 4, width: 32, height: 32, coins: 0, milk: 0, maxMilk: 5 };
        const keys = {};

        // Vaca
        const cow = { x: 250, y: 200, width: 48, height: 40, hasMilk: true, milkTimer: 0 };
        
        // Ponto de Venda (Bancada/Mercado)
        const market = { x: 650, y: 150, width: 60, height: 60 };

        // Recinto (Cerca)
        const fence = { x: 180, y: 130, width: 200, height: 180 };

        // Eventos de Teclado
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Distância entre dois pontos
        function getDistance(p1, p2) {
            return Math.hypot((p1.x + p1.width/2) - (p2.x + p2.width/2), (p1.y + p1.height/2) - (p2.y + p2.height/2));
        }

        // Loop Principal do Jogo
        function update() {
            // Movimentação do Fazendeiro
            if (keys['w'] || keys['arrowup']) player.y = Math.max(0, player.y - player.speed);
            if (keys['s'] || keys['arrowdown']) player.y = Math.min(canvas.height - player.height, player.y + player.speed);
            if (keys['a'] || keys['arrowleft']) player.x = Math.max(0, player.x - player.speed);
            if (keys['d'] || keys['arrowright']) player.x = Math.min(canvas.width - player.width, player.x + player.speed);

            // Regeneração de Leite da Vaca
            if (!cow.hasMilk) {
                cow.milkTimer++;
                if (cow.milkTimer > 300) { // ~5 segundos a 60fps
                    cow.hasMilk = true;
                    cow.milkTimer = 0;
                }
            }

            // Interação
            const actionPrompt = document.getElementById('action-prompt');
            actionPrompt.innerText = '';

            const distCow = getDistance(player, cow);
            const distMarket = getDistance(player, market);

            if (distCow < 60) {
                if (cow.hasMilk && player.milk < player.maxMilk) {
                    actionPrompt.innerText = '[ESPAÇO] Ordenhar a Vaca';
                    if (keys[' ']) {
                        player.milk++;
                        cow.hasMilk = false;
                        keys[' '] = false; // evitar disparos múltiplos
                    }
                } else if (!cow.hasMilk) {
                    actionPrompt.innerText = 'A vaca está descansando...';
                } else if (player.milk >= player.maxMilk) {
                    actionPrompt.innerText = 'Balde de leite cheio! Vá vender no mercado.';
                }
            } else if (distMarket < 70) {
                if (player.milk > 0) {
                    actionPrompt.innerText = '[ESPAÇO] Vender Leite ($15 cada)';
                    if (keys[' ']) {
                        player.coins += player.milk * 15;
                        player.milk = 0;
                        keys[' '] = false;
                    }
                } else {
                    actionPrompt.innerText = 'Traga leite para vender aqui!';
                }
            }

            // Atualiza UI
            document.getElementById('coins').innerText = player.coins;
            document.getElementById('milk').innerText = player.milk;
        }

        function draw() {
            // Limpa o Canvas (Grama)
            ctx.fillStyle = '#5d9e39';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenha o Recinto da Vaca (Cerca)
            ctx.strokeStyle = '#8d5524';
            ctx.lineWidth = 6;
            ctx.strokeRect(fence.x, fence.y, fence.width, fence.height);

            // Desenha a Vaca
            ctx.fillStyle = cow.hasMilk ? '#ffffff' : '#dddddd';
            ctx.beginPath();
            ctx.roundRect(cow.x, cow.y, cow.width, cow.height, 8);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Manchas da Vaca
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(cow.x + 15, cow.y + 15, 8, 0, Math.PI * 2);
            ctx.arc(cow.x + 32, cow.y + 25, 6, 0, Math.PI * 2);
            ctx.fill();

            // Indicador de Leite na Vaca
            if (cow.hasMilk) {
                ctx.fillStyle = '#fff';
                ctx.font = '16px sans-serif';
                ctx.fillText('🥛', cow.x + 14, cow.y - 8);
            }

            // Desenha o Mercado / Ponto de Venda
            ctx.fillStyle = '#d32f2f';
            ctx.fillRect(market.x, market.y, market.width, market.height);
            ctx.fillStyle = '#fff';
            ctx.font = '12px sans-serif';
            ctx.fillText('MERCADO', market.x + 4, market.y + 34);

            // Desenha o Fazendeiro
            ctx.fillStyle = '#2196f3'; // Roupa azul
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#ffcc80'; // Chapéu/cabeça
            ctx.fillRect(player.x + 4, player.y + 2, 24, 12);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Inicia o jogo
        gameLoop();
    </script>
</body>
</html>
